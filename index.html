<!DOCTYPE html>
<html lang="en">
<head>
    <title>Load Site</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device - width, initial - scale=1.0">
    <link href="./public/index.css" rel="stylesheet"/>
</head>
<body>
     <div class="button-container">

        <button data-loader-id="Markdown-App" data-backend="https://markdown-project-backend.onrender.com" data-frontend="https://markdown-project-app.onrender.com">
            Markdown-App
        </button>
        <div id="Markdown-App" class="progress-bar-container">
            <div class="progress-bar">
            
            </div>
            <p id="Markdown-App-progress-text" class="progress-text">30<span>%</span></p>
       </div>
        <div id="Markdown-App-note" class="note">
                            <p class="text">
                                <em>Note:</em> Apps Deployed Free On Render Typically Require a Few Seconds for the Server to Start-Up.<br/>
                                Please Wait.
                            </p>
                    </div>
        
        <button data-frontend="https://e-comm-app-eosin.vercel.app/">
            E-Commerce App/Frontend
        </button>
        <div id="E-Commerce" class="progress-bar-container">
            <div class="progress-bar">
            
            </div>
            <p id="Markdown-App-progress-text" class="progress-text">30%</p>

            <div class="note">
                <p class="text">
                    <em>Note: </em>
                </p>
            </div>
        </div>
       
     </div>
     <script type="text/javascript" src="./public/index.js"></script>
</body>

</html>
