<!DOCTYPE html>
<html lang="en">
<head>
    <title>Load Site</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device - width, initial - scale=1.0">
    <link href="./public/index.css" rel="stylesheet"/>
</head>
<body>
     <div class="button-container">
        <!-- button 1 -->
        <button data-homepage="markdown-form/xxxy@gmail.com"
        data-deployed-on="render" 
        data-loader-id="Markdown-App" 
        data-backend="https://markdown-project-backend.onrender.com" 
        data-frontend="https://markdown-project-app.onrender.com"
        data-test-path="availability">
            Markdown-App
        </button>

        <div id="Markdown-App" class="progress-bar-container">
            <div id="Markdown-App-progress-bar" class="progress-bar">
            
            </div>
            <p id="Markdown-App-progress-text" class="progress-text">30<span>%</span></p>
       </div>
        <div id="Markdown-App-note" class="note">
                            <p class="text">
                                <em>Note:</em> Apps Deployed Free On Render Typically Require a Few Seconds for the Server to Start-Up.<br/>
                                Please Wait.
                            </p>
                    </div>
        
                    <!-- button 2 -->
        <button data-loader-id="E-Commerce-App" 
        data-frontend="https://e-comm-app-eosin.vercel.app"
        data-test-path="api/availability"
        data-homepage="home">
            E-Commerce App/Frontend
        </button>

        <div data-deployed-on="vercel" id="E-Commerce-App" class="progress-bar-container">
            <div id="E-Commerce-App-progress-bar" class="progress-bar">
            
            </div>
            <p id="E-Commerce-App-progress-text" class="progress-text">30%</p>
        </div>
        <div id="E-Commerce-App-note" class="note">
                <p class="text">
                    <em>Note: </em>Verifying vercel's availability.....
                </p>
            </div>
       
     </div>
     <script type="text/javascript" src="./public/index.js"></script>
</body>

</html>
